[workspace]
members = ["librery-core", "librery-shell", "librery-tui"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
async-trait = "0.1"
axum = "0.7"
cargo-mutants = "1"
proptest = "1"
ratatui = "0.28"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
utoipa = "5"
utoipa-swagger-ui = "9"
